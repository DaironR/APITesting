name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  api-tests:
    name: Run REST Assured API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Instalar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Corregir permisos del Maven Wrapper
      - name: Set Maven Wrapper permissions
        run: chmod +x mvnw

      # 4. Ejecutar pruebas API
      - name: Run REST Assured API Tests
        run: ./mvnw --batch-mode clean test

      # 5. Generar reporte Allure
      - name: Generate Allure report
        if: always() && hashFiles('target/allure-results/*') != ''
        run: ./mvnw --batch-mode allure:report

      # 6. Guardar resultados Allure
      - name: Upload Allure results
        if: always() && hashFiles('target/allure-results/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      # 7. Guardar reporte HTML Allure
      - name: Upload Allure report
        if: always() && hashFiles('target/site/allure-maven-plugin/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      # 8. Publicar resultados JUnit
      - name: Publish test summary
        if: always() && hashFiles('target/surefire-reports/TEST-*.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: REST Assured Test Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
